buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath 'org.apache.grails:grails-gradle-plugins'
        classpath 'cloud.wondrify:asset-pipeline-gradle:5.0.34'
        classpath 'com.gorylenko.gradle-git-properties:gradle-git-properties:4.0.1'
        classpath 'io.github.gradle-nexus:publish-plugin:1.3.0'
    }
}

apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'org.apache.grails.gradle.grails-plugin'
apply plugin: 'cloud.wondrify.asset-pipeline'
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply plugin: 'com.gorylenko.gradle-git-properties'

group = 'io.github.gpc'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://repo.grails.org/grails/restricted' }
    maven {
        url = 'http://10.100.21.16:8080/repository/common-component-snapshots'
        allowInsecureProtocol = true
    }
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")

    implementation 'org.apache.grails:grails-core'
    implementation 'org.apache.grails:grails-logging'
    implementation 'org.apache.grails:grails-services'
    implementation 'org.apache.grails:grails-databinding'
    implementation 'org.apache.grails.i18n:grails-i18n'
    implementation 'org.apache.grails:grails-controllers'
    implementation 'org.apache.grails:grails-rest-transforms'
    implementation 'org.apache.grails:grails-data-hibernate5'
    implementation 'org.apache.grails:grails-async'
    implementation 'org.apache.grails:grails-scaffolding'
    implementation 'org.apache.grails:grails-gsp'
    implementation 'org.apache.grails.views:grails-web-gsp'
    implementation 'org.apache.grails.views:grails-web-gsp-taglib'

    implementation 'org.grails.plugins:grails-mail:5.0.3'
    implementation 'org.grails.plugins:mail-oauth:7.6.0-M1'
    implementation "org.apache.grails:grails-quartz:$grailsVersion"
    // Used by Validator.java; no longer provided transitively by GORM in Grails 7.
    implementation 'commons-validator:commons-validator:1.9.0'

    assets 'org.apache.grails:grails-dependencies-assets'

    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.apache.tomcat:tomcat-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-tomcat'
    testImplementation 'org.apache.grails.testing:grails-testing-support-core'
    testImplementation 'org.apache.grails:grails-testing-support-web'
    testImplementation 'org.apache.grails:grails-testing-support-datamapping'
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'net.bytebuddy:byte-buddy'
    testRuntimeOnly 'net.bytebuddy:byte-buddy-agent'
}

compileJava.options.release = 17

// https://github.com/apache/grails-core/issues/15321
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.optimizationOptions.indy = false
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// enable if you wish to package this plugin as a standalone application
bootJar.enabled = false

assets {
    packagePlugin = true
    minifyJs = true
    minifyCss = true
}

// assetPluginPackage defaults its destinationDirectory to build/resources/main, which processResources
// then cleans, deleting META-INF/assets before the jar is built. Give the task its own directory and
// package the jar from there. Must be inside afterEvaluate: the asset-pipeline plugin sets the
// destination in its own afterEvaluate and would overwrite a config-time assignment.
def packagedAssetsDir = layout.buildDirectory.dir('packagedAssets')
afterEvaluate {
    tasks.named('assetPluginPackage') {
        destinationDirectory = packagedAssetsDir.map { it.dir('META-INF') }
    }
}

tasks.register('sourceJar', Jar) {
    dependsOn generateGitProperties   // main resources include build/generated/resources/git
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    exclude 'git.properties'
}

tasks.register('packageJavadoc', Jar) {
    from javadoc
    archiveClassifier = 'javadoc'
}

tasks.register('packageGroovydoc', Jar) {
    from groovydoc
    archiveClassifier = 'groovydoc'
}

gitProperties {
    keys = ['git.branch', 'git.commit.id', 'git.commit.time', 'git.commit.id.abbrev']
    failOnNoGitDirectory = true
    extProperty = 'gitProps' // git properties will be put in a map at project.ext.gitProps
}

javadoc {
    source = sourceSets.main.allJava
    classpath = configurations.compileClasspath
    options {
        setMemberLevel JavadocMemberLevel.PUBLIC
        setAuthor true
        links 'https://docs.oracle.com/en/java/javase/17/docs/api/'
    }
}

generateGitProperties.outputs.upToDateWhen { false } // make sure the generateGitProperties task always executes (even when git.properties is not changed)

jar {
    enabled = true
    archiveClassifier = ''
    dependsOn generateGitProperties, tasks.named('assetPluginPackage')
    manifest {
        attributes("Built-By": System.getProperty("user.name"))
        attributes(["Plugin-Version"        : version,
                    "Plugin-Title"          : project.name,
                    "Plugin-Build-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "Git-Commit"            : "${-> project.ext.gitProps['git.commit.id.abbrev']}",
                    "Git-Branch"            : "${-> project.ext.gitProps['git.branch']}"])
    }
    from sourceSets.main.output
    from packagedAssetsDir
    exclude 'git.properties'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'asynchronous-mail'
            version = project.version

            from components.java
            artifact sourceJar
            artifact packageJavadoc
            artifact packageGroovydoc

            pom {
                name = 'Grails Asynchronous Mail Plugin'
                description = 'The plugin realises asynchronous mail sending. It stores messages in a DB and sends them asynchronously by a quartz job.'
                url = 'https://github.com/gpc/grails-asynchronous-mail'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'kefirfromperm'
                        name = 'Vitalii Samolovskikh'
                    }
                    developer {
                        id = 'stokito'
                        name = 'Sergey Ponomarev'
                    }
                    developer {
                        id = 'ilopmar'
                        name = 'Iván López'
                    }
                    developer {
                        id = 'burtbeckwith'
                        name = 'Burt Beckwith'
                    }
                    developer {
                        id = 'puneetbehl'
                        name = 'Puneet Behl'
                    }
                    developer {
                        id = 'aberbenni'
                        name = 'Alessandro Berbenni'
                    }
                    developer {
                        id = 'dpcasady'
                        name = 'Danny Casady'
                    }
                    developer {
                        id = 'SAgrawal14'
                        name = 'Shashank Agrawal'
                    }
                    developer {
                        id = 'visheshd'
                        name = 'Vishesh'
                    }
                    developer {
                        id = 'micke-a'
                        name = 'Mikael Andersson'
                    }
                    developer {
                        id = 'pgdoval'
                        name = 'Pablo González Doval'
                    }
                    developer {
                        id = 'Uniqen'
                        name = 'Magnus Dalin'
                    }
                    developer {
                        id = 'demon101'
                        name = 'Demon'
                    }
                    developer {
                        id = 'matrei'
                        name = 'Mattias Reichel'
                    }
                    developer {
                        id = 'vsachinv'
                        name = 'Sachin Verma'
                    }
                    developer {
                        id = 'rx-deepak-goyal'
                        name = 'Deepak Goyal'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/gpc/grails-asynchronous-mail.git'
                    developerConnection = 'scm:git:ssh://github.com:gpc/grails-asynchronous-mail.git'
                    url = 'https://github.com/gpc/grails-asynchronous-mail'
                }
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/gpc/grails-asynchronous-mail1")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }

        maven {
            name = "NexusRepo"
            credentials {
                username = project.findProperty("nexusUsername") ?: System.getenv("NEXUS_USERNAME")
                password = project.findProperty("nexusPassword") ?: System.getenv("NEXUS_PASSWORD")
            }
            def nexusRepoUrl = project.findProperty("nexusUrl") ?: System.getenv("NEXUS_URL")
            if (nexusRepoUrl) {
                url = uri(nexusRepoUrl)
            }
            allowInsecureProtocol = true
        }
    }
}

ext."signing.keyId" = project.findProperty('signing.keyId') ?: System.getenv('SIGNING_KEY_ID')
ext."signing.password" = project.findProperty('signing.password') ?: System.getenv('SIGNING_PASSPHRASE')
ext."signing.secretKeyRingFile" = project.findProperty('signing.secretKeyRingFile') ?: (System.getenv('SIGNING_PASSPHRASE') ?: "${System.getProperty('user.home')}/.gnupg/secring.gpg")

ext.isReleaseVersion = !version.toString().endsWith("SNAPSHOT")

afterEvaluate {
    signing {
        required { false }
        sign publishing.publications.maven
    }
}

tasks.withType(Sign).configureEach {
    onlyIf { isReleaseVersion }
}

if (project.hasProperty('release')) {
    apply plugin: 'io.github.gradle-nexus.publish-plugin'
    nexusPublishing {
        repositories {
            sonatype {
                def ossUser = System.getenv("SONATYPE_USERNAME") ?: project.findProperty('sonatypeOss2Username') ?: ''
                def ossPass = System.getenv("SONATYPE_PASSWORD") ?: project.findProperty("sonatypeOss2Password") ?: ''
                def ossStagingProfileId = System.getenv("SONATYPE_STAGING_PROFILE_ID") ?: project.findProperty("sonatypeOssStagingProfileIdJms") ?: ''

                nexusUrl = uri("https://s01.oss.sonatype.org/service/local/")
                snapshotRepositoryUrl = uri("https://s01.oss.sonatype.org/content/repositories/snapshots/")
                username = ossUser
                password = ossPass
                stagingProfileId = ossStagingProfileId
            }
        }
    }
}

tasks.register('snapshotVersion') {
    doLast {
        if (!project.version.toString().endsWith('-SNAPSHOT')) {
            ant.propertyfile(file: "gradle.properties") {
                entry(key: "version", value: "${project.version}-SNAPSHOT")
            }
        }
    }
}
