quartz:
  jdbcStore: false
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
dataSource:
  pooled: true
  jmxExport: true
  driverClassName: org.h2.Driver
  username: sa
  password: ''
  dbCreate: update
  # INIT registers a stand-in for the Oracle VPD procedure PKG_MART_SET_CONTEXT.SET_CONTEXT (see H2VpdContextStub)
  url: "jdbc:h2:mem:testDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS PKG_MART_SET_CONTEXT\\;CREATE ALIAS IF NOT EXISTS PKG_MART_SET_CONTEXT.SET_CONTEXT FOR 'grails.plugin.asyncmail.H2VpdContextStub.setContext'"
